# The release job. Pushing a tag vX.Y.Z runs every test, checks that the tag
# matches tern.version and that tern.js is the build of src/, and publishes
# the site (index.html, docs/, examples/, themes/, tern.js, tern.css) to GitHub Pages.
# The release itself is created by hand.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: the tag matches tern.version and package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          engine="$(node -p "require('./tern.js').version")"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag $tag, tern.version $engine, package.json $pkg"
          test "$tag" = "$engine" && test "$tag" = "$pkg"
      - run: npm test
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium firefox
      - run: sudo apt-get install -y mupdf-tools
      - run: node test/smoke.js

  pages:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: the site
        run: |
          mkdir -p _site
          cp -r index.html docs examples themes tern.js tern.css LICENSE .nojekyll _site/
          rm -f _site/docs/README.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
